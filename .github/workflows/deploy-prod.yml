name: Deploy Production

on:
  push:
    branches: [deploy/prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test run
      - run: yarn build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [validate]
    # Configure required reviewers on the "production" environment in repo
    # settings — that's what turns this into a manual-approval gate.
    # Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID set as secrets
    # on the "production" GitHub Environment, pointing at the Vercel
    # Production project (a separate Vercel project from UAT).
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Vercel CLI
        run: yarn dlx vercel@latest --version

      - name: Pull Vercel environment info
        run: yarn dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build via Vercel
        run: yarn dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to production
        run: yarn dlx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  promote-main:
    name: Promote deploy/prod to main
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward main to the deployed commit
        run: |
          git fetch origin deploy/prod
          git merge --ff-only origin/deploy/prod
          git push origin main

name: Deploy UAT

on:
  push:
    branches: [deploy/uat]
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test run
      - run: yarn build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.UAT_SITE_URL }}

  deploy:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: [validate]
    # Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID set as secrets
    # on the "uat" GitHub Environment, pointing at the Vercel UAT project.
    # Intentionally 0 required reviewers here — UAT deploys automatically
    # on push, unlike production (see deploy-prod.yml).
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Vercel CLI
        run: yarn dlx vercel@latest --version

      - name: Pull Vercel environment info
        run: yarn dlx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build via Vercel
        run: yarn dlx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to UAT
        run: yarn dlx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
